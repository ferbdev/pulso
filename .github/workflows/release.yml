name: Release

# Publica o Pulso.exe portátil no GitHub Releases a cada tag de versão (ex.: v0.1.0).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publicar executável único
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish src/Pulso/Pulso.csproj -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none `
            -p:Version=$version -o publish
          (Get-FileHash publish/Pulso.exe -Algorithm SHA256).Hash.ToLower() + "  Pulso.exe" |
            Set-Content publish/Pulso.exe.sha256 -Encoding ascii

      - name: Criar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" publish/Pulso.exe publish/Pulso.exe.sha256 `
            --title "Pulso ${{ github.ref_name }}" --generate-notes
